<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بریکی</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#FFF6DC;--fg:#3b2a1a;--mut:#8a6f55;--track:#f1dcae}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1710;--fg:#fbeed6;--mut:#c2a98a;--track:#3a2b1b}}
:root[data-theme="dark"]{--bg:#1f1710;--fg:#fbeed6;--mut:#c2a98a;--track:#3a2b1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
h1{font-size:20px;margin:0;font-weight:500}
#s{font-size:48px;font-weight:500;line-height:1}
.m{color:var(--mut);font-size:14px}
#w{position:relative;width:240px;height:220px}
#b{all:unset;cursor:pointer;display:block;width:240px;height:220px;transition:transform .08s}
#b:active{transform:scale(.92)}
.f{position:absolute;font-size:24px;font-weight:500;color:#E8602C;pointer-events:none;animation:up .8s ease-out forwards}
@keyframes up{to{transform:translateY(-80px);opacity:0}}
.t{width:240px;height:14px;background:var(--track);border-radius:7px;overflow:hidden}
#e{height:100%;width:100%;background:#FF7A45;border-radius:7px;transition:width .2s}
</style></head><body>
<h1>بریکی</h1>
<div><div id="s">0</div><div class="m">آجر</div></div>
<div id="w"><button id="b" aria-label="تپ">
<svg viewBox="0 0 240 220" width="240" height="220"><rect x="40" y="30" width="46" height="36" rx="11" fill="#E8602C"/><rect x="97" y="30" width="46" height="36" rx="11" fill="#E8602C"/><rect x="154" y="30" width="46" height="36" rx="11" fill="#E8602C"/><rect x="20" y="58" width="200" height="140" rx="26" fill="#FF7A45" stroke="#B5431A" stroke-width="4"/><rect x="22" y="166" width="196" height="30" rx="15" fill="#E8602C"/><circle cx="82" cy="108" r="15" fill="#2B2B2B"/><circle cx="158" cy="108" r="15" fill="#2B2B2B"/><circle cx="87" cy="102" r="5" fill="#fff"/><circle cx="163" cy="102" r="5" fill="#fff"/><ellipse cx="55" cy="136" rx="14" ry="8" fill="#FF9FB0"/><ellipse cx="185" cy="136" rx="14" ry="8" fill="#FF9FB0"/><path d="M102 134 Q120 154 138 134" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/></svg>
</button></div>
<div class="t"><div id="e"></div></div>
<div class="m">انرژی: <span id="et"></span></div>
<script>
var s=0,e=100,M=100;
try{s=+localStorage.getItem('bricky_s')||0}catch(x){}
var sc=document.getElementById('s'),en=document.getElementById('e'),et=document.getElementById('et'),b=document.getElementById('b'),w=document.getElementById('w');
function fa(n){return n.toLocaleString('fa-IR')}
function r(){sc.textContent=fa(s);en.style.width=(e/M*100)+'%';et.textContent=fa(e)+' / '+fa(M)}
b.addEventListener('pointerdown',function(ev){
if(e<1)return;e--;s++;r();
try{localStorage.setItem('bricky_s',s)}catch(x){}
var p=w.getBoundingClientRect(),f=document.createElement('span');
f.className='f';f.textContent='+۱';
f.style.left=(ev.clientX-p.left)+'px';f.style.top=(ev.clientY-p.top-20)+'px';
w.appendChild(f);f.addEventListener('animationend',function(){f.remove()});
});
setInterval(function(){if(e<M){e++;r()}},1000);
r();
</script></body></html>
